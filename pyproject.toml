[project]
name = "legislaml"
version = "0.2.0"
description = "AI and MLOps platform for predictive quality scoring and anomaly detection on Brazilian legislation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12",
    "joblib>=1.3",
    "lxml>=5.0",
    "mlflow>=2.10",
    "nltk>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "spacy>=3.7",
    "torch>=2.2",
    "transformers>=4.40",
    "xgboost>=2.0",
]

[dependency-groups]
serving = [
    "fastapi>=0.110",
    "numpy>=1.24",
    "pydantic>=2.6",
    "torch>=2.2",
    "transformers>=4.40",
    "uvicorn[standard]>=0.29",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.uv]
package = false
exclude-newer = "2026-11-09T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py", "src/labeling.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
