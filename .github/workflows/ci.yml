name: CI Quality Gates

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Ruff Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Run Ruff Linter
        run: uvx ruff check --config pyproject.toml src/ tests/ scripts/

  unit-tests:
    name: Unit Tests & Coverage (>=85%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install CPU dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r pyproject.toml --group dev --group serving

      - name: Run Pytest with Coverage Gate
        run: |
          PYTHONPATH=. .venv/bin/pytest tests/unit/ \
            --cov=src \
            --cov-fail-under=85 \
            --cov-report=term-missing | tee pytest-coverage.txt

      - name: Publish Coverage Summary
        if: always()
        run: |
          if [ -f pytest-coverage.txt ]; then
            echo "### 🧪 LegislaML Unit Test & Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 25 pytest-coverage.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: legislaml-serving:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (liveness 200, readiness 503 without checkpoint, non-root)
        run: bash scripts/smoke_container.sh legislaml-serving:ci

      - name: Publish image size
        if: always()
        run: |
          echo "### Inference image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          docker image ls legislaml-serving:ci >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
